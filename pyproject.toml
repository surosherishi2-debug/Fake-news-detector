[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "truthlens-omni"
version = "1.0.0"
description = "AI-Based Fake News Detection Using Machine Learning, Deep Learning and NLP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "TruthLens-Omni Engineering Team" }
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "data/raw",
    "data/processed",
    "experiments",
    "docs/paper",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # Line too long (handled by formatter / intentional docstrings)
    "B008",  # Do not perform function call in argument defaults (FastAPI Header/Depends)
    "B904",  # Within an except clause, raise exceptions with raise ... from err
    "UP035", # Deprecated typing imports (keep backward compatibility)
    "UP006", # Non-pep585 type annotations
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/data/downloader.py",
    "src/models/ceam_trainer.py",
    "src/graph/hgt_encoder.py",
    "src/graph/cascade_analyzer.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
precision = 1
